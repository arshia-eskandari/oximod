[package]
name = "oximod_core"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
authors = ["Arshia Eskandari <email@arshiaeskandari.com>"]
description = "Core runtime components for OxiMod, a schema-aware MongoDB modeling library for Rust."
license = "MIT"
repository = "https://github.com/arshia-eskandari/oximod"
readme = "README.md"
keywords = ["mongodb", "odm", "database", "async", "modeling"]
categories = ["database", "asynchronous"]

[dependencies]
async-trait = "0.1.89"
mongodb = "3.8.0"
thiserror = "2.0.18"
serde = "1.0.228"

[dependencies.regex]
version = "1.12.3"
default-features = false
features = ["std"]

[features]
# Enables diagnostic output in release builds.
debug-print = []
