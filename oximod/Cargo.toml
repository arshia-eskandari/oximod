[package]
name = "oximod"
version = "0.3.0"
edition = "2024"
authors = ["Arshia Eskandari <email@arshiaeskandari.com>"]
description = "MongoDB ODM for Rust inspired by Mongoose"
license = "MIT"
repository = "https://github.com/arshia-eskandari/oximod"
readme = "README.md"
keywords = ["mongodb", "odm", "mongoose", "rust"]
categories = ["database", "asynchronous"]

[dependencies]
async-trait = "0.1.89"
mongodb = "3.5.1"
thiserror = "2.0.18"
oximod_core = { version = "0.3.0", path = "../oximod_core" }
oximod_macros = { version = "0.3.0", path = "../oximod_macros" }
serde = "1.0.228"
futures-util = "0.3.32"

[dependencies.regex]
version = "1.12.3"
default-features = false
features = ["std"]

[dev-dependencies]
dotenv = "0.15.0"
testresult = "0.4.1"
tokio = { version = "1.49.0", features = ["full"] }
trybuild = "1"

[features]
debug-print = ["oximod_core/debug-print"]
