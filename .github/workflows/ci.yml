name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: oximod-mongodb-integration-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      RUST_BACKTRACE: full

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust (stable)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install Rust source
        run: rustup component add rust-src

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests with nextest
        run: cargo nextest run --no-fail-fast --all-targets --all-features

      - name: Run doctests
        run: cargo test --doc

      - name: Build docs
        run: cargo doc --workspace --all-features --no-deps

  # Proves OxiMod and its dependency graph compile and pass the
  # database-free unit suites at the declared minimum supported Rust
  # version (rust-version in the crate manifests). The MongoDB
  # integration suite runs only on stable above.
  msrv:
    runs-on: ubuntu-latest

    env:
      RUST_BACKTRACE: full

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust (1.88.0, minimum supported)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.88.0
          override: true

      - name: Check workspace at the minimum supported Rust version
        run: cargo check --workspace --all-targets --all-features

      - name: Run database-free unit tests
        run: |
          cargo test -p oximod_core
          cargo test -p oximod_macros
