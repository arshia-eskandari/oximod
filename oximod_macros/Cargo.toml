[package]
name = "oximod_macros"
version = "0.4.0"
edition = "2024"
authors = ["Arshia Eskandari <email@arshiaeskandari.com>"]
description = "Procedural macros for the OxiMod MongoDB ODM."
license = "MIT"
repository = "https://github.com/arshia-eskandari/oximod"
readme = "README.md"
keywords = ["mongodb", "odm", "macro", "derive", "mongoose"]
categories = ["database", "asynchronous"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.117", features = ["full"] }
quote = "1.0.44"
proc-macro2 = "1.0.106"
mongodb = "3.5.1"
thiserror = "2.0.18"
oximod_core = { version = "0.4.0", path = "../oximod_core" }
futures-util = "0.3.32"

[dependencies.regex]
version = "1.12.3"
default-features = false
features = ["std", "unicode-perl"]
